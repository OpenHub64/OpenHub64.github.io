<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHub World</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #1b1d23;
    --panel: #22252d;
    --border: #343947;
    --text: #e9ebf1;
    --muted: #9aa1b2;
    --accent: #6ee7c8;
    --accent-dark: #2f9c81;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: Arial, sans-serif;
    height: 100%;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 1.5rem 1rem 2.5rem;
  }
  header {
    width: 100%; max-width: 900px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem;
  }
  header h1 { font-size: 1.4rem; margin: 0; }
  a.home-btn {
    text-decoration: none; color: var(--accent);
    border: 1px solid var(--accent-dark); border-radius: 999px;
    padding: 0.35rem 0.9rem; font-size: 0.85rem;
  }
  #status { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }
  #gameWrap {
    position: relative;
    width: 100%; max-width: 900px;
  }
  canvas {
    display: block; width: 100%; height: auto;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 10px;
    image-rendering: pixelated;
    touch-action: none;
    cursor: crosshair;
  }
  #loginGate {
    max-width: 400px; width: 100%;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.5rem; text-align: center;
  }
  #loginGate p { color: var(--muted); line-height: 1.5; }
  #loginGate a { color: var(--accent); }
  .hint {
    margin-top: 0.75rem; color: var(--muted); font-size: 0.85rem; text-align: center;
  }
  #playerCount { color: var(--accent); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="home-btn">⌂ Home</a>
  <h1>🕹️ OpenHub World</h1>
  <span style="width:60px"></span>
</header>

<div id="status">Connecting…</div>

<div id="gameWrap" style="display:none;">
  <canvas id="game" width="900" height="600"></canvas>
</div>

<div id="loginGate">
  <p>You need to be signed in to enter the world.</p>
  <p><a href="index.html">Sign in on OpenHub</a>, then come back here.</p>
</div>

<p class="hint"><strong>A/D</strong> or <strong>←/→</strong> to move, <strong>W / ↑ / Space</strong> to jump (double jump in mid-air), <strong>click</strong> to shoot. Players online: <span id="playerCount">0</span></p>

<script>
(function () {
  "use strict";

  const SUPABASE_URL      = 'https://paifmufeevsdgvepewex.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ETpMX8Y6EkfUU725IhcpaQ_l5D6XreY';
  const supabaseClient    = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $status      = document.getElementById('status');
  const $gameWrap    = document.getElementById('gameWrap');
  const $loginGate   = document.getElementById('loginGate');
  const $playerCount = document.getElementById('playerCount');
  const canvas       = document.getElementById('game');
  const ctx          = canvas.getContext('2d');

  const WORLD_W       = canvas.width;
  const WORLD_H       = canvas.height;
  const PLAYER_SIZE   = 24;
  const MOVE_SPEED    = 220;       // horizontal px per second
  const GRAVITY       = 1400;      // px per second^2
  const JUMP_VELOCITY = -560;      // px per second (negative = up)
  const DOUBLE_JUMP_VELOCITY = -480;
  const MAX_FALL_SPEED = 900;
  const BROADCAST_HZ  = 20;        // broadcast ticks per second (50ms) — pure pub/sub, zero DB writes during movement
  const DB_SYNC_MS    = 3000;      // write to DB every 3s just to keep presence alive for join-late players
  const STALE_MS      = 15000;     // remove players silent for this long
  const LERP_FACTOR   = 0.18;      // interpolation per frame for other players — tune 0.10 (smoother) – 0.25 (snappier)

  // ── Combat ────────────────────────────────────────────────────────────────
  const MAX_HEALTH      = 100;
  const BULLET_DAMAGE    = 18;
  const BULLET_SPEED     = 760;    // px per second
  const BULLET_RADIUS    = 4;
  const BULLET_LIFETIME  = 1100;   // ms before a bullet despawns
  const HIT_RADIUS       = PLAYER_SIZE / 2 + BULLET_RADIUS;
  const RESPAWN_MS       = 2500;
  const SHOOT_COOLDOWN_MS = 220;

  // ── Platforms (solid ground the player can stand on / land on) ─────────────
  // x,y = top-left corner. Player rests with feet on top surface (y).
  const GROUND_Y = WORLD_H - 40;
  const platforms = [
    { x: 0,   y: GROUND_Y, w: WORLD_W, h: 40 },   // floor spanning the world
    { x: 120, y: 460,      w: 160,     h: 18 },
    { x: 360, y: 380,      w: 140,     h: 18 },
    { x: 580, y: 300,      w: 160,     h: 18 },
    { x: 340, y: 220,      w: 120,     h: 18 },
    { x: 60,  y: 260,      w: 120,     h: 18 },
    { x: 700, y: 460,      w: 140,     h: 18 }
  ];

  let currentUser = null;
  let myColor     = '#6ee7c8';
  let myUsername  = 'Anon';

  // Own position — authoritative, client-predicted. vy = vertical velocity.
  let me = { x: WORLD_W / 2, y: GROUND_Y - PLAYER_SIZE / 2, vy: 0 };
  let onGround   = false;
  let jumpsUsed  = 0;           // 0 = none used, 1 = first jump, 2 = double jump used
  let jumpKeyHeld = false;      // edge-trigger so holding jump doesn't spam

  // Combat state (self-authoritative — I own my own health)
  let myHealth   = MAX_HEALTH;
  let myAlive    = true;
  let respawnAt  = 0;
  let lastShotAt = 0;

  // Bullets in flight: id → { ownerId, x, y, vx, vy, spawnedAt, color }
  const bullets = new Map();
  let bulletSeq = 0;

  // Other players: id → { username, color, x, y, tx, ty, updated_at, health, alive }
  //   x/y  = interpolated render position
  //   tx/ty = target position received from broadcast
  const others = new Map();

  // ─── Mouse / shooting ──────────────────────────────────────────────────────
  let broadcastChannelRef = null;

  canvas.addEventListener('mousedown', (e) => {
    if (!currentUser || !myAlive) return;
    const now = performance.now();
    if (now - lastShotAt < SHOOT_COOLDOWN_MS) return;
    lastShotAt = now;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    const angle = Math.atan2(clickY - me.y, clickX - me.x);
    spawnBullet(currentUser.id, me.x, me.y, angle, myColor, true);
  });

  function spawnBullet(ownerId, x, y, angle, color, isMine) {
    const id = ownerId + ':' + (bulletSeq++) + ':' + Date.now();
    bullets.set(id, {
      ownerId, color,
      x, y,
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED,
      spawnedAt: performance.now()
    });
    if (isMine && broadcastChannelRef) {
      broadcastChannelRef.send({
        type: 'broadcast',
        event: 'shoot',
        payload: { ownerId, x, y, angle, color, id }
      });
    }
  }

  // ─── Input ───────────────────────────────────────────────────────────────────
  const keys = Object.create(null);
  window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup',   (e) => { keys[e.key.toLowerCase()] = false; });

  // ─── Helpers ─────────────────────────────────────────────────────────────────
  function randomColor(seed) {
    const colors = ['#6ee7c8','#ff6b6b','#ffd166','#6ea8ff','#c792ea','#ff9f6e','#7ee787'];
    let h = 0;
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return colors[h % colors.length];
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  // ─── Initialisation ──────────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      $status.textContent = 'Not signed in.';
      $loginGate.style.display = 'block';
      return;
    }

    currentUser = session.user;
    $loginGate.style.display = 'none';
    $gameWrap.style.display  = 'block';
    $status.textContent      = 'Loading your profile…';

    // Fetch own profile
    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('username')
      .eq('id', currentUser.id)
      .single();

    myUsername = (profile && profile.username) ? profile.username : 'Anon';
    myColor    = randomColor(currentUser.id);
    me.x       = 100 + Math.random() * (WORLD_W - 200);
    me.y       = GROUND_Y - PLAYER_SIZE / 2;
    me.vy      = 0;
    myHealth   = MAX_HEALTH;
    myAlive    = true;

    // Initial DB presence row
    await supabaseClient.from('world_players').upsert({
      id:         currentUser.id,
      username:   myUsername,
      color:      myColor,
      x:          me.x,
      y:          me.y,
      updated_at: new Date().toISOString()
    });

    // Seed other players from DB snapshot (for late joiners)
    const { data: existing } = await supabaseClient.from('world_players').select('*');
    if (existing) {
      existing.forEach((row) => {
        if (row.id === currentUser.id) return;
        others.set(row.id, { ...row, tx: row.x, ty: row.y, health: MAX_HEALTH, alive: true });
      });
    }

    // ── Realtime broadcast channel (no DB round-trip per move) ──────────────
    // Broadcast carries position at ~20 Hz. This is a pure WebSocket pub/sub
    // message — it does NOT hit Postgres and has ~5–15ms latency vs 80–300ms
    // for postgres_changes.
    const broadcastChannel = supabaseClient.channel('world:movement', {
      config: { broadcast: { self: false } }
    });
    broadcastChannelRef = broadcastChannel;

    broadcastChannel
      .on('broadcast', { event: 'move' }, ({ payload }) => {
        const { id, username, color, x, y, health, alive } = payload;
        if (id === currentUser.id) return;

        const existing = others.get(id);
        if (existing) {
          // Update target; interpolation will glide render position toward it
          existing.tx = x;
          existing.ty = y;
          existing.username   = username;
          existing.color      = color;
          existing.health     = health;
          existing.alive      = alive;
          existing.updated_at = Date.now();
        } else {
          // First time seeing this player — snap immediately, no lerp jump
          others.set(id, {
            id, username, color,
            x, y,       // render starts at target
            tx: x, ty: y,
            health, alive,
            updated_at: Date.now()
          });
        }
      })
      .on('broadcast', { event: 'shoot' }, ({ payload }) => {
        if (payload.ownerId === currentUser.id) return;
        spawnBullet(payload.ownerId, payload.x, payload.y, payload.angle, payload.color, false);
      })
      // Also watch DB changes for join/leave events (presence) and late-joiner sync
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'world_players' }, ({ old: o }) => {
        others.delete(o.id);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'world_players' }, ({ new: row }) => {
        if (row.id === currentUser.id) return;
        if (!others.has(row.id)) {
          others.set(row.id, { ...row, tx: row.x, ty: row.y, health: MAX_HEALTH, alive: true });
        }
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          $status.textContent = `Connected. You are ${myUsername}.`;
        }
      });

    // ── Broadcast loop (high-frequency, no DB) ───────────────────────────────
    let lastBroadcast = { x: null, y: null, health: null, alive: null };
    setInterval(() => {
      if (!currentUser) return;
      if (lastBroadcast.x === me.x && lastBroadcast.y === me.y &&
          lastBroadcast.health === myHealth && lastBroadcast.alive === myAlive) return;
      lastBroadcast = { x: me.x, y: me.y, health: myHealth, alive: myAlive };
      broadcastChannel.send({
        type:    'broadcast',
        event:   'move',
        payload: {
          id:       currentUser.id,
          username: myUsername,
          color:    myColor,
          x:        Math.round(me.x * 100) / 100,
          y:        Math.round(me.y * 100) / 100,
          health:   myHealth,
          alive:    myAlive
        }
      });
    }, Math.floor(1000 / BROADCAST_HZ));

    // ── Slow DB sync (keep presence alive for late joiners) ──────────────────
    setInterval(async () => {
      if (!currentUser) return;
      await supabaseClient.from('world_players').update({
        x:          me.x,
        y:          me.y,
        updated_at: new Date().toISOString()
      }).eq('id', currentUser.id);
    }, DB_SYNC_MS);

    // ── Cleanup on tab close ──────────────────────────────────────────────────
    window.addEventListener('beforeunload', () => {
      broadcastChannel.send({
        type: 'broadcast', event: 'leave',
        payload: { id: currentUser.id }
      });
      supabaseClient.from('world_players').delete().eq('id', currentUser.id);
    });

    requestAnimationFrame(loop);
  }

  // ─── Game loop ───────────────────────────────────────────────────────────────
  let lastFrame = performance.now();

  function loop(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    if (!myAlive) {
      // Frozen while dead — countdown to respawn
      if (performance.now() >= respawnAt) {
        myAlive   = true;
        myHealth  = MAX_HEALTH;
        me.x      = 100 + Math.random() * (WORLD_W - 200);
        me.y      = GROUND_Y - PLAYER_SIZE / 2;
        me.vy     = 0;
        onGround  = false;
        jumpsUsed = 0;
      }
    } else {
      // ── Horizontal input ────────────────────────────────────────────────────
      let dx = 0;
      if (keys['a'] || keys['arrowleft'])  dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;
      me.x = me.x + dx * MOVE_SPEED * dt;
      me.x = Math.max(PLAYER_SIZE / 2, Math.min(WORLD_W - PLAYER_SIZE / 2, me.x));

      // ── Jump input (edge-triggered — a single press = one jump attempt) ─────
      const jumpKeyDown = keys['w'] || keys['arrowup'] || keys[' '];
      if (jumpKeyDown && !jumpKeyHeld) {
        if (onGround) {
          me.vy = JUMP_VELOCITY;
          onGround = false;
          jumpsUsed = 1;
        } else if (jumpsUsed === 1) {
          me.vy = DOUBLE_JUMP_VELOCITY;
          jumpsUsed = 2;
        }
      }
      jumpKeyHeld = jumpKeyDown;

      // ── Gravity + vertical motion ────────────────────────────────────────────
      me.vy = Math.min(me.vy + GRAVITY * dt, MAX_FALL_SPEED);
      const prevBottom = me.y + PLAYER_SIZE / 2;
      me.y += me.vy * dt;

      // ── Platform collision (only land on solid ground from above) ───────────
      onGround = false;
      const half = PLAYER_SIZE / 2;
      const feetY = me.y + half;
      const left  = me.x - half * 0.8;   // slightly narrower hitbox for forgiving edges
      const right = me.x + half * 0.8;

      for (const p of platforms) {
        const withinX = right > p.x && left < p.x + p.w;
        if (!withinX) continue;
        const platTop = p.y;
        if (me.vy >= 0 && prevBottom <= platTop + 1 && feetY >= platTop) {
          me.y = platTop - half;
          me.vy = 0;
          onGround = true;
          jumpsUsed = 0;
          break;
        }
      }

      // World bounds — don't fall through the floor platform, don't fly off top
      if (me.y - half < 0) { me.y = half; me.vy = Math.max(me.vy, 0); }
      if (me.y + half > WORLD_H) { me.y = WORLD_H - half; me.vy = 0; onGround = true; jumpsUsed = 0; }
    }

    // ── Interpolate other players toward their broadcast target ───────────────
    const nowMs = Date.now();
    others.forEach((p, id) => {
      // Stale check — if we haven't heard from them in a while, remove
      if (nowMs - p.updated_at > STALE_MS) {
        others.delete(id);
        return;
      }
      // Lerp render position toward target
      p.x = lerp(p.x, p.tx, LERP_FACTOR);
      p.y = lerp(p.y, p.ty, LERP_FACTOR);
    });

    updateBullets(dt);

    draw();
    requestAnimationFrame(loop);
  }

  // ─── Bullets: simulation, platform blocking, and self-authoritative hit detection ──
  function updateBullets(dt) {
    const nowPerf = performance.now();
    bullets.forEach((b, id) => {
      if (nowPerf - b.spawnedAt > BULLET_LIFETIME) { bullets.delete(id); return; }

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (b.x < 0 || b.x > WORLD_W || b.y < 0 || b.y > WORLD_H) { bullets.delete(id); return; }

      // Blocked by solid platforms
      for (const p of platforms) {
        if (b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) {
          bullets.delete(id);
          return;
        }
      }

      // Self-authoritative hit check: only I decide if a bullet (that isn't mine)
      // hit ME, using my own real position — avoids trusting shooter's lag/lerp.
      if (b.ownerId !== currentUser.id && myAlive) {
        const ddx = b.x - me.x, ddy = b.y - me.y;
        if (ddx * ddx + ddy * ddy <= HIT_RADIUS * HIT_RADIUS) {
          bullets.delete(id);
          myHealth = Math.max(0, myHealth - BULLET_DAMAGE);
          if (myHealth <= 0) {
            myAlive   = false;
            respawnAt = performance.now() + RESPAWN_MS;
          }
        }
      }
    });
  }

  // ─── Rendering ───────────────────────────────────────────────────────────────
  function drawHealthBar(x, y, health, isMe) {
    const w = 32, h = 5;
    const bx = x - w / 2, by = y - PLAYER_SIZE / 2 - 20;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, w, h);
    const pct = Math.max(0, health) / MAX_HEALTH;
    ctx.fillStyle = pct > 0.5 ? '#7ee787' : (pct > 0.25 ? '#ffd166' : '#ff6b6b');
    ctx.fillRect(bx, by, w * pct, h);
  }

  function drawPlayer(x, y, color, label, isMe, health, alive) {
    if (!alive) {
      // Dead — faded ghost marker only
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, PLAYER_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }

    ctx.shadowColor = isMe ? 'rgba(110,231,200,0.35)' : 'rgba(0,0,0,0.4)';
    ctx.shadowBlur  = isMe ? 12 : 6;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, PLAYER_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();

    if (isMe) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth   = 2;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;

    ctx.fillStyle   = '#e9ebf1';
    ctx.font        = '12px Arial';
    ctx.textAlign   = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur  = 4;
    ctx.fillText(label, x, y - PLAYER_SIZE / 2 - 6);
    ctx.shadowBlur  = 0;

    drawHealthBar(x, y, health, isMe);
  }

  function drawBullets() {
    bullets.forEach((b) => {
      ctx.fillStyle = b.color || '#fff';
      ctx.shadowColor = b.color || '#fff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function draw() {
    ctx.clearRect(0, 0, WORLD_W, WORLD_H);

    // Grid background
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth   = 1;
    for (let gx = 0; gx < WORLD_W; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, WORLD_H); ctx.stroke();
    }
    for (let gy = 0; gy < WORLD_H; gy += 40) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(WORLD_W, gy); ctx.stroke();
    }

    // Platforms
    platforms.forEach((p) => {
      ctx.fillStyle = '#343947';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#4a5066';
      ctx.fillRect(p.x, p.y, p.w, 4);
    });

    drawBullets();

    let liveCount = 1;
    others.forEach((p) => {
      liveCount++;
      const alive = p.alive !== false;
      drawPlayer(p.x, p.y, p.color || '#6ea8ff', p.username || 'Anon', false, p.health ?? MAX_HEALTH, alive);
    });

    drawPlayer(me.x, me.y, myColor, myUsername, true, myHealth, myAlive);

    // Death overlay
    if (!myAlive) {
      const secsLeft = Math.max(0, (respawnAt - performance.now()) / 1000);
      ctx.fillStyle = 'rgba(10,12,16,0.55)';
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('You died', WORLD_W / 2, WORLD_H / 2 - 10);
      ctx.fillStyle = '#e9ebf1';
      ctx.font = '15px Arial';
      ctx.fillText(`Respawning in ${secsLeft.toFixed(1)}s`, WORLD_W / 2, WORLD_H / 2 + 20);
    }

    $playerCount.textContent = liveCount;
  }

  init();
})();
</script>

</body>
</html>
