<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Login - My Supabase App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            background-color: #3ECF8E; 
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button.secondary {
            background-color: #333;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        /* New styles for the logged-in view */
        #loggedInUI {
            display: none; /* Hidden by default */
            text-align: center;
        }
        #loggedInUI h3 {
            margin-bottom: 20px;
            color: #3ECF8E;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        
        <div id="loggedOutUI">
            <h2>Welcome Back</h2>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="button-group">
                <button id="loginBtn">Log In</button>
                <button id="signupBtn" class="secondary">Sign Up</button>
            </div>
        </div>

        <div id="loggedInUI">
            <h3 id="welcomeText">You are logged in!</h3>
            <button id="logoutBtn" class="secondary">Log Out</button>
        </div>
        
        <div id="message"></div>

    </div>

    <script>
        // 1. Initialize Supabase
        const SUPABASE_URL = 'https://paifmufeevsdgvepewex.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ETpMX8Y6EkfUU725IhcpaQ_l5D6XreY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Select HTML elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        
        const loggedOutUI = document.getElementById('loggedOutUI');
        const loggedInUI = document.getElementById('loggedInUI');
        const welcomeText = document.getElementById('welcomeText');
        const messageDiv = document.getElementById('message');

        // Helper function to show messages
        function showMessage(text, isError = false) {
            messageDiv.style.display = 'block';
            messageDiv.textContent = text;
            messageDiv.className = isError ? 'error' : 'success';
        }

        // Helper function to hide the message box
        function clearMessage() {
            messageDiv.style.display = 'none';
        }

        // 3. Listen for Authentication Changes (The Magic Part!)
        // This runs automatically when the page loads, and anytime the user logs in or out.
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                // User is logged in (e.g., they just clicked the email link)
                loggedOutUI.style.display = 'none';
                loggedInUI.style.display = 'block';
                welcomeText.textContent = `Welcome, ${session.user.email}!`;
                clearMessage();
            } else {
                // User is logged out
                loggedInUI.style.display = 'none';
                loggedOutUI.style.display = 'block';
                emailInput.value = '';
                passwordInput.value = '';
            }
        });

        // 4. Handle Sign Up
        signupBtn.addEventListener('click', async () => {
            clearMessage();
            const email = emailInput.value;
            const password = passwordInput.value;

            if (!email || !password) return showMessage("Please enter both email and password.", true);

            showMessage("Creating account...");
            const { error } = await supabaseClient.auth.signUp({ email, password });

            if (error) {
                showMessage(error.message, true);
            } else {
                showMessage("Success! Check your email to confirm your account.");
            }
        });

        // 5. Handle Log In
        loginBtn.addEventListener('click', async () => {
            clearMessage();
            const email = emailInput.value;
            const password = passwordInput.value;

            if (!email || !password) return showMessage("Please enter both email and password.", true);

            showMessage("Logging in...");
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showMessage(error.message, true);
            }
            // If successful, onAuthStateChange automatically fires and changes the UI!
        });

        // 6. Handle Log Out
        logoutBtn.addEventListener('click', async () => {
            const { error } = await supabaseClient.auth.signOut();
            if (error) {
                showMessage("Error logging out: " + error.message, true);
            }
            // If successful, onAuthStateChange automatically fires and changes the UI!
        });
    </script>

</body>
</html>
