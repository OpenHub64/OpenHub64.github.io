<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHub Portal</title>
    <style>
        :root {
            --bg-color: #313338;
            --card-bg: #2b2d31;
            --text-color: #dbdee1;
            --text-heading: #f2f3f5;
            --text-sub: #949ba4;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --border-color: #232428;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body.light-mode {
            --bg-color: #f2f3f5;
            --card-bg: #ffffff;
            --text-color: #313338;
            --text-heading: #060607;
            --text-sub: #5c5e66;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --border-color: #e3e5e8;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .logo-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-heading);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-color);
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hub-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-heading);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-sub);
            max-width: 500px;
            line-height: 1.4;
        }

        .card-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.2s ease;
        }

        .card-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <span>🚀</span> OpenHub Portal
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
            <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
        </button>
    </header>

    <main>
        <div class="hub-card">
            <div class="card-info">
                <div class="card-title">
                    💬 Discord Chat
                </div>
                <div class="card-desc">
                    Connect with friends, chat in real-time server channels, send direct messages, and use Discord features.
                </div>
            </div>
            <a href="chat.html" class="card-btn">Open Chat</a>
        </div>

        <div class="hub-card">
            <div class="card-info">
                <div class="card-title">
                    🎮 3D Platformer Game
                </div>
                <div class="card-desc">
                    Jump into the 3D platformer game world, overcome obstacles, and reach the finish line.
                </div>
            </div>
            <a href="3D platformer game.html" class="card-btn">Play Game</a>
        </div>
    </main>

    <script>
        // Check saved theme preference or default to dark
        const currentTheme = localStorage.getItem('theme') || 'dark';
        
        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            updateThemeUI('light');
        } else {
            updateThemeUI('dark');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const theme = isLight ? 'light' : 'dark';
            
            localStorage.setItem('theme', theme);
            updateThemeUI(theme);
        }

        function updateThemeUI(theme) {
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            if (theme === 'light') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
        }
    </script>
</body>
</html>
