<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>OpenHub Chat</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #36393f; color: #dcddde; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout Grid */
        #app { display: flex; width: 100%; height: 100%; }
        
        /* Far Left: Server List */
        .server-nav { width: 72px; background-color: #202225; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 10px; overflow-y: auto; }
        .server-icon { width: 48px; height: 48px; background-color: #36393f; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; font-weight: bold; color: white; }
        .server-icon:hover, .server-icon.active { border-radius: 15px; background-color: #3ECF8E; }
        .server-icon.hub { background-color: #5865F2; }
        .divider { width: 32px; height: 2px; background-color: #2d2f32; border-radius: 1px; }

        /* Inner Left: Channel/Friend List */
        .sidebar { width: 240px; background-color: #2f3136; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .list-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; }
        .list-item:hover, .list-item.active { background-color: #393c43; color: white; }
        .list-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

        /* Main Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #36393f; }
        .chat-header { padding: 15px; border-bottom: 1px solid #282a2e; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .messages-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Messages */
        .message { display: flex; gap: 15px; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .msg-header { display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px; }
        .msg-username { font-weight: bold; color: white; }
        .msg-time { font-size: 12px; color: #72767d; }
        .msg-content { line-height: 1.4; }

        /* Input */
        .input-area { padding: 20px; }
        .input-wrapper { background-color: #40444b; border-radius: 8px; display: flex; padding: 10px 15px; }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px; }
        
        button.action-btn { background: #3ECF8E; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        button.action-btn:hover { opacity: 0.8; }
        a.back-btn { color: #aaa; text-decoration: none; font-size: 14px; }
        a.back-btn:hover { color: white; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app">
    <div class="server-nav" id="serverNav">
        <div class="server-icon hub active" id="btnHub" title="Hub & DMs">💬</div>
        <div class="divider"></div>
        <div id="serverList"></div>
        <div class="server-icon" id="btnCreateServer" style="color: #3ECF8E; background: #2f3136;" title="Create Server">+</div>
        <div class="divider"></div>
        <a href="index.html" class="server-icon" style="font-size:12px; background: #ed4245; text-decoration:none;">Exit</a>
    </div>

    <div class="sidebar">
        <div class="sidebar-header" id="sidebarHeader">Direct Messages</div>
        <div class="list-container" id="sidebarList">
            </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <span id="chatTitle"># global-chat</span>
            <button id="inviteBtn" class="action-btn" style="display:none;">+ Invite Friend</button>
        </div>
        <div class="messages-box" id="messagesBox"></div>
        <form class="input-area" id="chatForm">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Message..." autocomplete="off" required>
            </div>
        </form>
    </div>
</div>

<script>
    // 1. CONFIGURATION
    const SUPABASE_URL = 'https://paifmufeevsdgvepewex.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ETpMX8Y6EkfUU725IhcpaQ_l5D6XreY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let friends = [];
    
    // Chat State: mode can be 'global', 'dm', or 'server'
    let currentMode = 'global';
    let currentTargetId = null; // Either friend's UUID or Server's ID

    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

    // DOM Elements
    const messagesBox = document.getElementById('messagesBox');
    const chatTitle = document.getElementById('chatTitle');
    const sidebarList = document.getElementById('sidebarList');
    const sidebarHeader = document.getElementById('sidebarHeader');
    const serverList = document.getElementById('serverList');
    const inviteBtn = document.getElementById('inviteBtn');

    // Boot Up
    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) return window.location.href = 'index.html';
        currentUser = session.user;

        await loadFriends();
        await loadServers();
        setMode('global', null, 'global-chat');
        setupRealtime();
    }

    // --- DATA FETCHING ---
    async function loadFriends() {
        const { data } = await supabase.from('friendships').select(`
            status, user_id, friend_id,
            requester:profiles!friendships_user_id_fkey(id, username, avatar_base64),
            receiver:profiles!friendships_friend_id_fkey(id, username, avatar_base64)
        `).eq('status', 'accepted').or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);
        
        friends = data?.map(rel => rel.user_id === currentUser.id ? rel.receiver : rel.requester) || [];
    }

    async function loadServers() {
        const { data } = await supabase.from('servers').select(`
            id, name, server_members!inner(user_id)
        `).eq('server_members.user_id', currentUser.id);
        
        serverList.innerHTML = '';
        if (data) {
            data.forEach(server => {
                const div = document.createElement('div');
                div.className = 'server-icon';
                div.textContent = server.name.charAt(0).toUpperCase();
                div.title = server.name;
                div.onclick = () => setMode('server', server.id, server.name);
                serverList.appendChild(div);
            });
        }
    }

    // --- UI ROUTING ---
    function setMode(mode, targetId, titleText) {
        currentMode = mode;
        currentTargetId = targetId;
        chatTitle.textContent = mode === 'global' ? '# global-chat' : (mode === 'server' ? `# ${titleText}` : `@ ${titleText}`);
        inviteBtn.style.display = mode === 'server' ? 'block' : 'none';
        
        // Update Sidebars
        if (mode === 'global' || mode === 'dm') {
            sidebarHeader.textContent = "Direct Messages";
            sidebarList.innerHTML = `<div class="list-item ${mode==='global'?'active':''}" onclick="setMode('global', null, 'global-chat')">🌐 Global Chat</div>`;
            friends.forEach(f => {
                sidebarList.innerHTML += `
                    <div class="list-item ${currentTargetId === f.id ? 'active' : ''}" onclick="setMode('dm', '${f.id}', '${f.username}')">
                        <img class="list-avatar" src="${f.avatar_base64 || DEFAULT_AVATAR}"> ${f.username}
                    </div>`;
            });
        } else if (mode === 'server') {
            sidebarHeader.textContent = titleText;
            sidebarList.innerHTML = `<div class="list-item active"># general</div>`;
            // You could fetch server members here and list them below!
        }
        
        loadMessages();
    }

    // --- MESSAGING LOGIC ---
    async function loadMessages() {
        messagesBox.innerHTML = '<div style="text-align:center; padding:20px;">Loading...</div>';
        let query;

        if (currentMode === 'global') {
            query = supabase.from('messages').select(`*, profiles(username, avatar_base64)`).is('profile_id', null).order('created_at', { ascending: false }).limit(50);
            // Fallback since our old table used profile_id for global chat
            query = supabase.from('messages').select(`*, profiles(username, avatar_base64)`).order('created_at', { ascending: false }).limit(50);
        } else if (currentMode === 'server') {
            query = supabase.from('server_messages').select(`*, profiles(username, avatar_base64)`).eq('server_id', currentTargetId).order('created_at', { ascending: false }).limit(50);
        } else if (currentMode === 'dm') {
            query = supabase.from('dms').select(`*, profiles!dms_sender_id_fkey(username, avatar_base64)`).or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentTargetId}),and(sender_id.eq.${currentTargetId},receiver_id.eq.${currentUser.id})`).order('created_at', { ascending: false }).limit(50);
        }

        const { data } = await query;
        messagesBox.innerHTML = '';
        if (data) data.reverse().forEach(renderMessage);
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        if (currentMode === 'global') {
            await supabase.from('messages').insert([{ profile_id: currentUser.id, content: text }]);
        } else if (currentMode === 'server') {
            await supabase.from('server_messages').insert([{ profile_id: currentUser.id, server_id: currentTargetId, content: text }]);
        } else if (currentMode === 'dm') {
            await supabase.from('dms').insert([{ sender_id: currentUser.id, receiver_id: currentTargetId, content: text }]);
        }
    });

    function renderMessage(msg) {
        // Handle slightly different joins depending on table
        const profile = msg.profiles || (msg.sender_id ? msg.profiles : null) || { username: 'Unknown', avatar_base64: DEFAULT_AVATAR };
        
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `
            <img class="msg-avatar" src="${profile.avatar_base64 || DEFAULT_AVATAR}">
            <div>
                <div class="msg-header">
                    <span class="msg-username">${profile.username}</span>
                    <span class="msg-time">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                </div>
                <div class="msg-content">${msg.content.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]))}</div>
            </div>`;
        messagesBox.appendChild(div);
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    // --- SERVER CREATION & INVITES ---
    document.getElementById('btnCreateServer').addEventListener('click', async () => {
        const name = prompt("Enter new Server name:");
        if (!name) return;
        
        const { data, error } = await supabase.from('servers').insert([{ name, owner_id: currentUser.id }]).select().single();
        if (data) {
            await supabase.from('server_members').insert([{ server_id: data.id, user_id: currentUser.id }]);
            await loadServers();
            setMode('server', data.id, data.name);
        }
    });

    inviteBtn.addEventListener('click', async () => {
        if(friends.length === 0) return alert("You have no friends to invite yet!");
        let promptText = "Type the number of the friend to invite:\n";
        friends.forEach((f, i) => promptText += `${i+1}. ${f.username}\n`);
        
        const idx = parseInt(prompt(promptText)) - 1;
        if (friends[idx]) {
            await supabase.from('server_members').insert([{ server_id: currentTargetId, user_id: friends[idx].id }]);
            alert(`${friends[idx].username} was added to the server!`);
        }
    });

    // --- REALTIME ---
    function setupRealtime() {
        supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                if(currentMode === 'global') fetchAndRenderSingle(payload.new, 'messages');
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'server_messages' }, payload => {
                if(currentMode === 'server' && payload.new.server_id === currentTargetId) fetchAndRenderSingle(payload.new, 'server_messages');
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dms' }, payload => {
                if(currentMode === 'dm' && (payload.new.sender_id === currentTargetId || payload.new.receiver_id === currentTargetId)) {
                    fetchAndRenderSingle(payload.new, 'dms');
                }
            })
            .subscribe();
    }

    async function fetchAndRenderSingle(rawMsg, table) {
        // Quick fetch to get the profile picture of the sender for the realtime message
        const profileCol = table === 'dms' ? 'sender_id' : 'profile_id';
        const { data } = await supabase.from('profiles').select('username, avatar_base64').eq('id', rawMsg[profileCol]).single();
        rawMsg.profiles = data;
        renderMessage(rawMsg);
    }

    init();
</script>
</body>
</html>
